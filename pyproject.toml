[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "r2dn-dc-motor-control"
version = "0.14.0"
description = "R2DN world-model experiments for electrothermal DC-motor control"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
r2dn = [
    "flax==0.10.4",
    "jax==0.5.3",
    "robustnn @ git+https://github.com/nic-barbara/R2DN.git@5e65ac9bb5a057d41232162133ac1454865b965b",
]
phase2 = [
    "matplotlib>=3.9",
]
phase3 = [
    "matplotlib>=3.9",
]
phase4 = [
    "matplotlib>=3.9",
]
phase5 = [
    "matplotlib>=3.9",
]
phase6 = [
    "flax==0.10.4",
    "jax==0.5.3",
    "matplotlib>=3.9",
    "optax>=0.2.4,<0.3",
    "robustnn @ git+https://github.com/nic-barbara/R2DN.git@5e65ac9bb5a057d41232162133ac1454865b965b",
]
phase6-cuda12 = [
    "jax[cuda12]==0.5.3",
]

[project.scripts]
validate-phase0 = "r2dn_dc_motor.validate_phase0:main"
validate-phase1 = "r2dn_dc_motor.validate_phase1:main"
validate-phase2 = "r2dn_dc_motor.validate_phase2:main"
validate-phase3 = "r2dn_dc_motor.validate_phase3:main"
validate-phase4 = "r2dn_dc_motor.validate_phase4:main"
validate-phase5 = "r2dn_dc_motor.validate_phase5:main"
validate-phase6 = "r2dn_dc_motor.validate_phase6:main"
validate-phase6b = "r2dn_dc_motor.validate_phase6b:main"
validate-phase6d = "r2dn_dc_motor.validate_phase6d:main"
validate-phase6e = "r2dn_dc_motor.validate_phase6e:main"
validate-phase6f = "r2dn_dc_motor.validate_phase6f:main"
validate-phase7 = "r2dn_dc_motor.validate_phase7:main"
compare-r2dn-rk4 = "r2dn_dc_motor.compare_r2dn_rk4:main"
compare-hidden-thermal-models = "r2dn_dc_motor.compare_hidden_thermal_models:main"
evaluate-thermal-test-bank = "r2dn_dc_motor.evaluate_thermal_test_bank:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "r2dn_integration: requires the optional official R2DN/JAX dependency",
    "phase3_gate: runs the complete deterministic Phase-3 numerical pilot",
    "phase4_gate: generates and verifies the deterministic Phase-4 CI dataset",
    "phase5_gate: fits and evaluates physical baselines on a tiny deterministic dataset",
    "phase6_gate: trains and validates the official R2DN on a tiny deterministic dataset",
    "phase6b_gate: repeats latent search and runs a tiny autoregressive stress suite",
    "phase6d_gate: runs a tiny controlled R2DN accuracy ablation",
    "phase6e_gate: runs a tiny full-curriculum larger-latent search",
    "phase6f_gate: runs a tiny controlled optimizer-floor ablation",
    "phase7_gate: runs the pure-R2DN broadband accuracy study",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
