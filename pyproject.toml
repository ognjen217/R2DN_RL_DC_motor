[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "r2dn-dc-motor-control"
version = "0.4.0"
description = "R2DN world-model experiments for electrothermal DC-motor control"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
r2dn = [
    "flax==0.10.4",
    "jax==0.5.3",
    "robustnn @ git+https://github.com/nic-barbara/R2DN.git@5e65ac9bb5a057d41232162133ac1454865b965b",
]
phase2 = [
    "matplotlib>=3.9",
]
phase3 = [
    "matplotlib>=3.9",
]

[project.scripts]
validate-phase0 = "r2dn_dc_motor.validate_phase0:main"
validate-phase1 = "r2dn_dc_motor.validate_phase1:main"
validate-phase2 = "r2dn_dc_motor.validate_phase2:main"
validate-phase3 = "r2dn_dc_motor.validate_phase3:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "r2dn_integration: requires the optional official R2DN/JAX dependency",
    "phase3_gate: runs the complete deterministic Phase-3 numerical pilot",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
