schema_version = 1

[phase]
number = "6D"
name = "r2dn_accuracy_ablation"
status = "implemented"

[selection]
fit_split = "train"
selection_split = "validation"
id_test_used_for_selection = false
ood_test_used_for_selection = false
stress_used_for_selection = false
metric = "validation_free_rollout_nrmse"
aggregation = "median_across_seeds"
mode = "min"
near_tie_policy = "first_simpler_variant_within_relative_tolerance"

[screen]
burn_in_steps = [250, 500, 1000]
validation_horizon_steps = 10000
validation_windows = 8
validation_window_seed = 66001

[profiles.ci]
base_phase6_profile = "ci"
seeds = [7]
selection_horizon_steps = 50
validation_windows = 2
validation_window_seed = 66001
tie_relative_tolerance = 0.03
target_combined_nrmse = 1.0

[[profiles.ci.variants]]
name = "A_control"
latent_size = 4
burn_in_steps = 20
curriculum = "ci_baseline"

[[profiles.ci.variants]]
