schema_version = 1

[phase]
number = "6F"
name = "latent16_optimizer_floor_ablation"
status = "implemented"

[selection]
fit_split = "train"
selection_split = "synthetic_validation_multisine"
selection_reference = "full_rk4"
phase6e_checkpoint_is_baseline = true
canonical_phase6c_scenario_used_for_selection = false
phase6e_selection_scenarios_reused = false
run_metric = "median_multisine_combined_nrmse"
mode = "min"
near_tie_policy = "lowest_training_budget_within_relative_tolerance"

[profiles.ci]
base_phase6_profile = "ci"
latent_size = 4
seed = 7
burn_in_steps = 20
selection_duration_s = 0.02
selection_chunk_steps = 10
selection_split = "validation"
selection_anchor_indices = [0]
tie_relative_tolerance = 0.02
target_combined_nrmse = 1.0

[[profiles.ci.variants]]
name = "baseline_phase6e"
source = "phase6e_checkpoint"
schedule = "constant"
initial_learning_rate = 0.001
final_learning_rate = 0.001
stage_update_multiplier = 1

[[profiles.ci.variants]]
name = "cosine_1x"
source = "train"
schedule = "cosine_decay"
initial_learning_rate = 0.001
final_learning_rate = 0.00001
stage_update_multiplier = 1

[[profiles.ci.variants]]
name = "cosine_2x"
source = "train"
schedule = "cosine_decay"
initial_learning_rate = 0.001
final_learning_rate = 0.00001
stage_update_multiplier = 2

[[profiles.ci.multisine_scenarios]]
name = "optimizer_multisine_ci"
kind = "multisine"
amplitudes_v = [2.0]
frequencies_hz = [0.95]
phases_rad = [0.65]

[profiles.final]
base_phase6_profile = "final"
latent_size = 16
seed = 43
burn_in_steps = 250
selection_duration_s = 100.0
selection_chunk_steps = 10000
selection_split = "validation"
selection_anchor_indices = [3, 0, 2]
tie_relative_tolerance = 0.02
target_combined_nrmse = 0.20

[[profiles.final.variants]]
name = "baseline_phase6e"
source = "phase6e_checkpoint"
schedule = "constant"
initial_learning_rate = 0.001
final_learning_rate = 0.001
stage_update_multiplier = 1

[[profiles.final.variants]]
name = "cosine_1x"
source = "train"
schedule = "cosine_decay"
initial_learning_rate = 0.001
final_learning_rate = 0.00001
stage_update_multiplier = 1

[[profiles.final.variants]]
name = "cosine_2x"
source = "train"
schedule = "cosine_decay"
initial_learning_rate = 0.001
final_learning_rate = 0.00001
stage_update_multiplier = 2

[[profiles.final.multisine_scenarios]]
name = "optimizer_multisine_d"
kind = "multisine"
amplitudes_v = [5.8, 4.2, 2.8]
frequencies_hz = [0.43, 1.31, 2.93]
phases_rad = [0.35, 1.35, 2.35]

[[profiles.final.multisine_scenarios]]
name = "optimizer_multisine_e"
kind = "multisine"
amplitudes_v = [6.2, 3.8, 2.6]
frequencies_hz = [0.71, 1.61, 3.23]
phases_rad = [0.75, 1.85, 2.65]

[[profiles.final.multisine_scenarios]]
name = "optimizer_multisine_f"
kind = "multisine"
amplitudes_v = [5.2, 4.3, 3.2]
frequencies_hz = [0.97, 1.79, 2.47]
phases_rad = [1.20, 2.20, 0.55]

[validation]
maximum_safe_voltage_v = 20.0
required_checks = [
    "baseline_checkpoint_is_phase6e_winner",
    "all_declared_optimizer_variants_are_evaluated",
    "all_training_and_selection_rollouts_are_finite",
    "all_contractivity_margins_are_positive",
    "selection_scenarios_are_new_and_canonical_is_held_out",
    "selected_checkpoint_matches_locked_tie_rule",
]
